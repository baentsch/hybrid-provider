name: CI

# Two tiers (see design.md "Continuous integration tiers"):
#   regular (push / PR / manual) — FAST and deterministic: a minimal PINNED matrix
#     (one pre-3.5 + one >=3.5 OpenSSL release, liboqs 0.16.0, oqs-provider @
#     known-good commit). It must not scale with OpenSSL releases or track
#     upstream main, so push/PR signal stays fast and independent of upstream.
#   weekly (schedule / manual) — EXHAUSTIVE + bleeding edge: the full
#     per-OpenSSL-version floor matrix (3.0 .. master) built against liboqs main +
#     oqs-provider main, re-validating the drop-in contract as upstream moves.
#     Never blocks a PR.

on:
  push:               # primary trigger — every push is tested, even before a PR exists
  pull_request:       # deduplicated by the `gate` job (skipped when the push already covered the tree)
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — weekly exhaustive matrix
                          # (the nightly deprecation tripwire is its own workflow)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------- gate ---
  # Deduplicate the push vs pull_request double-trigger. A branch push is the
  # PRIMARY CI trigger, so every push is tested (even before a PR exists). The
  # pull_request run only adds value when it tests something the push did not — i.e.
  # when the branch is behind its base and the merge tree differs from the pushed
  # tip. When the branch already contains the base tip, the push built this exact
  # tree, so the PR run is a duplicate and is skipped. Fork PRs are the exception: a
  # fork push never triggers this repo's push workflow, so their PR run must proceed.
  gate:
    name: gate (skip duplicate PR runs)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "non-PR event ($EVENT) -> run"; exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "fork PR -> run (no push run exists)"; exit 0
          fi
          # Both commits are present (fetch-depth: 0). If the base tip is already an
          # ancestor of head, the branch sits on top of base: the merge tree equals
          # the pushed tip the push run already built -> skip this duplicate.
          if git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "branch contains base tip -> push already tested this tree; skipping duplicate PR run"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "branch behind base -> merge differs from pushed tip; running"
          fi

  # ---------------------------------------------------------------- regular ---
  regular:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    name: OpenSSL ${{ matrix.openssl.name }} (release)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimal by design: one pre-3.5 tier and one >=3.5 tier — enough to cover
        # both behaviour regimes without scaling per OpenSSL release. The full
        # per-version floor sweep lives in the weekly job. pre35 marks OpenSSL
        # without native ML-KEM/ML-DSA (added in 3.5.0): its PQ half comes from
        # the PQ-only oqsprovider, so it runs the drop-in subset, not the full suite.
        openssl:
          - { name: "3.4",    series: "3.4", pre35: "true"  }
          - { name: "latest", series: "",    pre35: "false" }   # highest stable tag
    env:
      PREFIX: ${{ github.workspace }}/.local
      LIBOQS_REF: "0.16.0"
      OQSPROV_REF: "00fde3373e466043ee30ed31e32c56f6964ee5f4"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL release ref
        id: ossl
        run: |
          set -euo pipefail
          S='${{ matrix.openssl.series }}'
          if [ -n "$S" ]; then GLOB="openssl-$S.*"; RE="^openssl-${S//./\\.}\\.[0-9]+$"
          else GLOB="openssl-*"; RE="^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$"; fi
          REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "$GLOB" \
                | awk -F/ '{print $NF}' | grep -E "$RE" | sort -V | tail -1)
          SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      # One cache holds the pinned toolchain: OpenSSL + liboqs install (.local)
      # and the oqs-provider build. Everything is a fixed ref, so it reuses across
      # runs until a pin changes.
      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/.interop/oqs-provider
          key: reg-${{ runner.os }}-ossl-${{ steps.ossl.outputs.sha }}-liboqs-${{ env.LIBOQS_REF }}-oqsp-${{ env.OQSPROV_REF }}

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$PREFIX" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Configure hybrid provider
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON

      # Builds/installs pinned liboqs + oqs-provider (skips liboqs if already in
      # $PREFIX from cache; ninja no-ops the cached oqs-provider build) and
      # symlinks oqsprovider.so into build/.
      - name: Build liboqs + oqs-provider (pinned)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — full suite (OpenSSL >= 3.5)
        if: matrix.openssl.pre35 != 'true'
        working-directory: build
        run: LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure

      # Pre-3.5 the default provider has no native ML-KEM/ML-DSA (and no seed
      # API), so MLX-vs-default checks and the STANDARDIZED composite tiers
      # self-skip. The PQ half comes from the cede-patched, PQ-only oqsprovider, so
      # the drop-in replacement and oqs-compose tests still apply: hybrid_replace_test
      # proves hybrid-provider serves the hybrid KEMs on 3.0+ and, from 3.2, the
      # sigs. The EXPERIMENTAL composite signatures (raw private key, no seed API)
      # also run here — composite_sig_test/composite_test exercise them and self-skip
      # the standardized rows, proving composite works below 3.5 for that tier.
      - name: Test — pre-3.5 subset (drop-in over PQ-only oqsprovider)
        if: matrix.openssl.pre35 == 'true'
        working-directory: build
        run: |
          LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure \
            -R 'hybrid_replace_test|hybrid_oqs_test|hybrid_compctx_test|hybrid_capability_test|hybrid_bench|composite_sig_test|composite_test|composite_sig_bench|composite_kem_bench|composite_kem_prov_test'

  # --------------------------------------------------------------- sanitize ---
  # Memory-safety audit automation (issue #42): build the provider + tests with
  # ASan/UBSan (LeakSanitizer rides along with ASan) against the latest OpenSSL
  # (>=3.5, so native PQ + the composite tier are exercised) and run the whole
  # in-process suite under the sanitizers. The CLI scenario tests (hybrid_scenarios_*)
  # shell out to the uninstrumented openssl binary, which cannot dlopen an
  # instrumented provider, so they are excluded from this leg.
  sanitize:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    name: ASan/UBSan/LSan (latest OpenSSL)
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.workspace }}/.local
      LIBOQS_REF: "0.16.0"
      OQSPROV_REF: "00fde3373e466043ee30ed31e32c56f6964ee5f4"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL release ref
        id: ossl
        run: |
          set -euo pipefail
          REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "openssl-*" \
                | awk -F/ '{print $NF}' | grep -E "^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$" \
                | sort -V | tail -1)
          SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/.interop/oqs-provider
          key: reg-${{ runner.os }}-ossl-${{ steps.ossl.outputs.sha }}-liboqs-${{ env.LIBOQS_REF }}-oqsp-${{ env.OQSPROV_REF }}

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$PREFIX" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Configure hybrid provider (sanitizers)
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON -DHYBRID_SANITIZE=ON

      - name: Build liboqs + oqs-provider (pinned)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — in-process suite under ASan/UBSan/LSan
        working-directory: build
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PREFIX/lib64"
          export ASAN_OPTIONS="abort_on_error=1:detect_leaks=1:strict_string_checks=1"
          export LSAN_OPTIONS="suppressions=${GITHUB_WORKSPACE}/test/lsan.supp"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          ctest --output-on-failure -E 'hybrid_scenarios_'

  # ----------------------------------------------------------------- weekly ---
  # Exhaustive per-OpenSSL-version floor matrix against bleeding-edge liboqs +
  # oqs-provider main. Re-validates the drop-in replacement contract as upstream
  # moves and surfaces OQS_CEDE_HYBRIDS patch drift early. Never gates a PR.
  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: weekly · OpenSSL ${{ matrix.openssl.name }} (main deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One tier per behaviour regime, no more: 3.0 = KEM-only (TLS-SIGALG
        # advertising is guarded to 3.2+ in hybrid_caps.c, so the provider builds
        # KEM-only below that); 3.2 = sigs advertised but no native PQ (PQ still
        # entirely from the PQ-only oqsprovider); latest = newest stable release
        # (native ML-KEM/ML-DSA + composite); master = bleeding edge. 3.3/3.4 are
        # the same regime as 3.2, so they add nothing here. pre35 tiers get their
        # PQ from oqsprovider.
        openssl:
          - { name: "3.0",    series: "3.0",    pre35: "true"  }
          - { name: "3.2",    series: "3.2",    pre35: "true"  }
          - { name: "latest", series: "",       pre35: "false" }
          - { name: "master", series: "master", pre35: "false" }
    env:
      PREFIX: ${{ github.workspace }}/.local
      OSSL_INSTALL: ${{ github.workspace }}/ossl-install
      LIBOQS_REF: "main"
      OQSPROV_REF: "main"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL ref
        id: ossl
        run: |
          set -euo pipefail
          S='${{ matrix.openssl.series }}'
          if [ "$S" = "master" ]; then
            REF=master
            SHA=$(git ls-remote https://github.com/openssl/openssl refs/heads/master | cut -f1)
          else
            # empty series => newest stable release; otherwise newest of that series
            if [ -n "$S" ]; then GLOB="openssl-$S.*"; RE="^openssl-${S//./\\.}\\.[0-9]+$"
            else GLOB="openssl-*"; RE="^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$"; fi
            REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "$GLOB" \
                  | awk -F/ '{print $NF}' | grep -E "$RE" | sort -V | tail -1)
            SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      # Cache OpenSSL only (keyed on the resolved commit): released tags stay warm,
      # master rotates. liboqs + oqs-provider main are always rebuilt fresh by
      # setup_oqs_interop.sh — the whole point of this tier — so PREFIX is not cached.
      - name: Cache OpenSSL
        id: cache-ossl
        uses: actions/cache@v4
        with:
          path: ${{ env.OSSL_INSTALL }}
          key: weekly-ossl-${{ runner.os }}-${{ steps.ossl.outputs.sha }}

      - name: Build OpenSSL
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$OSSL_INSTALL" --libdir=lib64
          make -j"$(nproc)" build_sw
          make install_sw

      - name: Stage OpenSSL into .local
        run: cp -a "$OSSL_INSTALL" "$PREFIX"

      - name: Configure hybrid provider
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON

      - name: Build liboqs + oqs-provider (main, fresh)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — full suite (OpenSSL >= 3.5)
        if: matrix.openssl.pre35 != 'true'
        working-directory: build
        run: LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure

      - name: Test — pre-3.5 subset (drop-in over PQ-only oqsprovider)
        if: matrix.openssl.pre35 == 'true'
        working-directory: build
        run: |
          LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure \
            -R 'hybrid_replace_test|hybrid_oqs_test|hybrid_compctx_test|hybrid_capability_test|hybrid_bench|composite_sig_test|composite_test|composite_sig_bench|composite_kem_bench|composite_kem_prov_test'
