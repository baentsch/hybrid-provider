name: CI

# Two tiers (see design.md "Continuous integration tiers"):
#   regular (push / PR / manual) — FAST and deterministic: a minimal PINNED matrix
#     (one pre-3.5 + one >=3.5 OpenSSL release, liboqs 0.16.0, oqs-provider @
#     known-good commit). It must not scale with OpenSSL releases or track
#     upstream main, so push/PR signal stays fast and independent of upstream.
#   weekly (schedule / manual) — EXHAUSTIVE + bleeding edge: the full
#     per-OpenSSL-version floor matrix (3.0 .. master) built against liboqs main +
#     oqs-provider main, re-validating the drop-in contract as upstream moves.
#     Never blocks a PR.

on:
  push:               # primary trigger — every push is tested, even before a PR exists
  pull_request:       # deduplicated by the `gate` job (skipped when the push already covered the tree)
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "libFuzzer session length for the fuzz leg (seconds)"
        required: false
        default: "1800"
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — weekly exhaustive matrix
                          # (the nightly deprecation tripwire is its own workflow)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------- gate ---
  # Deduplicate the push vs pull_request double-trigger. A branch push is the
  # PRIMARY CI trigger, so every push is tested (even before a PR exists). The
  # pull_request run only adds value when it tests something the push did not — i.e.
  # when the branch is behind its base and the merge tree differs from the pushed
  # tip. When the branch already contains the base tip, the push built this exact
  # tree, so the PR run is a duplicate and is skipped. Fork PRs are the exception: a
  # fork push never triggers this repo's push workflow, so their PR run must proceed.
  gate:
    name: gate (skip duplicate PR runs)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "non-PR event ($EVENT) -> run"; exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "fork PR -> run (no push run exists)"; exit 0
          fi
          # Both commits are present (fetch-depth: 0). If the base tip is already an
          # ancestor of head, the branch sits on top of base: the merge tree equals
          # the pushed tip the push run already built -> skip this duplicate.
          if git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "branch contains base tip -> push already tested this tree; skipping duplicate PR run"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "branch behind base -> merge differs from pushed tip; running"
          fi

  # ---------------------------------------------------------------- regular ---
  regular:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'schedule'
    name: OpenSSL ${{ matrix.openssl.name }} (release)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimal by design: one pre-3.5 tier and one >=3.5 tier — enough to cover
        # both behaviour regimes without scaling per OpenSSL release. The full
        # per-version floor sweep lives in the weekly job. pre35 marks OpenSSL
        # without native ML-KEM/ML-DSA (added in 3.5.0): its PQ half comes from
        # the PQ-only oqsprovider, so it runs the drop-in subset, not the full suite.
        openssl:
          - { name: "3.4",    series: "3.4", pre35: "true"  }
          - { name: "latest", series: "",    pre35: "false" }   # highest stable tag
    env:
      PREFIX: ${{ github.workspace }}/.local
      LIBOQS_REF: "0.16.0"
      OQSPROV_REF: "00fde3373e466043ee30ed31e32c56f6964ee5f4"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL release ref
        id: ossl
        run: |
          set -euo pipefail
          S='${{ matrix.openssl.series }}'
          if [ -n "$S" ]; then GLOB="openssl-$S.*"; RE="^openssl-${S//./\\.}\\.[0-9]+$"
          else GLOB="openssl-*"; RE="^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$"; fi
          REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "$GLOB" \
                | awk -F/ '{print $NF}' | grep -E "$RE" | sort -V | tail -1)
          SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      # One cache holds the pinned toolchain: OpenSSL + liboqs install (.local)
      # and the oqs-provider build. Everything is a fixed ref, so it reuses across
      # runs until a pin changes.
      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/.interop/oqs-provider
          key: reg-${{ runner.os }}-ossl-${{ steps.ossl.outputs.sha }}-liboqs-${{ env.LIBOQS_REF }}-oqsp-${{ env.OQSPROV_REF }}

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$PREFIX" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Configure hybrid provider
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON

      # Builds/installs pinned liboqs + oqs-provider (skips liboqs if already in
      # $PREFIX from cache; ninja no-ops the cached oqs-provider build) and
      # symlinks oqsprovider.so into build/.
      - name: Build liboqs + oqs-provider (pinned)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — full suite (OpenSSL >= 3.5)
        if: matrix.openssl.pre35 != 'true'
        working-directory: build
        run: LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure

      # Pre-3.5 the default provider has no native ML-KEM/ML-DSA (and no seed
      # API), so MLX-vs-default checks and the STANDARDIZED composite tiers
      # self-skip. The PQ half comes from the cede-patched, PQ-only oqsprovider, so
      # the drop-in replacement and oqs-compose tests still apply: hybrid_replace_test
      # proves hybrid-provider serves the hybrid KEMs on 3.0+ and, from 3.2, the
      # sigs. The EXPERIMENTAL composite signatures (raw private key, no seed API)
      # also run here — composite_sig_test/composite_test exercise them and self-skip
      # the standardized rows, proving composite works below 3.5 for that tier.
      - name: Test — pre-3.5 subset (drop-in over PQ-only oqsprovider)
        if: matrix.openssl.pre35 == 'true'
        working-directory: build
        run: |
          LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure \
            -R 'hybrid_replace_test|hybrid_oqs_test|hybrid_compctx_test|hybrid_capability_test|hybrid_bench|hybrid_sizes_test|hybrid_threads_test|composite_sig_test|composite_test|composite_sig_bench|composite_kem_bench|composite_kem_prov_test'

  # --------------------------------------------------------------- sanitize ---
  # Memory-safety audit automation (issue #42): build the provider + tests with
  # ASan/UBSan (LeakSanitizer rides along with ASan) against the latest OpenSSL
  # (>=3.5, so native PQ + the composite tier are exercised) and run the whole
  # in-process suite under the sanitizers. The CLI scenario tests (hybrid_scenarios_*)
  # shell out to the uninstrumented openssl binary, which cannot dlopen an
  # instrumented provider, so they are excluded from this leg.
  #
  # POST-MERGE ONLY (push to main): the instrumented full-suite run is expensive,
  # so it is kept off the PR critical path for fast turnaround. Running on every
  # merge still guards main and ties any failure to a specific merge commit — no
  # nightly/scheduled run, which would need a separate issue to track a failure.
  sanitize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: ASan/UBSan/LSan (latest OpenSSL)
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.workspace }}/.local
      LIBOQS_REF: "0.16.0"
      OQSPROV_REF: "00fde3373e466043ee30ed31e32c56f6964ee5f4"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL release ref
        id: ossl
        run: |
          set -euo pipefail
          REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "openssl-*" \
                | awk -F/ '{print $NF}' | grep -E "^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$" \
                | sort -V | tail -1)
          SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/.interop/oqs-provider
          key: reg-${{ runner.os }}-ossl-${{ steps.ossl.outputs.sha }}-liboqs-${{ env.LIBOQS_REF }}-oqsp-${{ env.OQSPROV_REF }}

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$PREFIX" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Configure hybrid provider (sanitizers)
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON -DHYBRID_SANITIZE=ON

      - name: Build liboqs + oqs-provider (pinned)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — in-process suite under ASan/UBSan/LSan
        working-directory: build
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PREFIX/lib64"
          export ASAN_OPTIONS="abort_on_error=1:detect_leaks=1:strict_string_checks=1"
          export LSAN_OPTIONS="suppressions=${GITHUB_WORKSPACE}/test/lsan.supp"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          ctest --output-on-failure -E 'hybrid_scenarios_'

  # -------------------------------------------------------------------- tsan ---
  # Thread-safety audit automation (issue #43): build the provider + tests with
  # ThreadSanitizer against the latest OpenSSL (>=3.5, so the concurrency test's
  # X25519MLKEM768 + p256_mldsa44 resolve entirely from the default provider, no
  # oqsprovider needed) and run hybrid_threads_test — many threads doing
  # keygen/encaps/decaps/sign/verify on shared algorithms and a shared key,
  # concurrent provider load/unload, and a fork-then-operate leg. Scoped to that
  # one test: races inside the uninstrumented libcrypto would otherwise dominate
  # the report (test/tsan.supp filters any that still surface). setarch -R (wired
  # into the ctest command) disables ASLR so TSan's shadow mapping does not abort.
  #
  # POST-MERGE ONLY (push to main), like the sanitize leg: off the PR critical
  # path, guards every merge, and ties any failure to a specific merge commit
  # rather than a scheduled run that would need a tracking issue.
  tsan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: ThreadSanitizer (latest OpenSSL)
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.workspace }}/.local
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL release ref
        id: ossl
        run: |
          set -euo pipefail
          REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "openssl-*" \
                | awk -F/ '{print $NF}' | grep -E "^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$" \
                | sort -V | tail -1)
          SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      # Reuse the regular/sanitize leg's toolchain cache (same key) — only the
      # OpenSSL install under $PREFIX is needed here.
      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/.interop/oqs-provider
          key: reg-${{ runner.os }}-ossl-${{ steps.ossl.outputs.sha }}-liboqs-0.16.0-oqsp-00fde3373e466043ee30ed31e32c56f6964ee5f4

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$PREFIX" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Configure hybrid provider (ThreadSanitizer)
        run: cmake -S . -B build -G Ninja -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON -DHYBRID_TSAN=ON

      - name: Build provider + threads test
        run: cmake --build build --target hybrid-provider hybrid_threads_test -j"$(nproc)"

      - name: Test — concurrency/fork/teardown under TSan
        working-directory: build
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PREFIX/lib64"
          export HYBRID_CEDE_TO_DEFAULT=0
          ctest --output-on-failure -R hybrid_threads_test

  # -------------------------------------------------------- sanitize (pre-3.5) ---
  # ASan/UBSan/LSan on a pre-3.5 OpenSSL (3.4), where the default provider has no
  # native ML-KEM/ML-DSA and the tests therefore source the PQ halves from
  # oqsprovider. This is the memory-safety coverage of the oqsprovider-backed
  # composition and concurrency paths that the >=3.5 sanitize/tsan legs do not
  # exercise (there the PQ halves come from the default provider, so oqsprovider
  # is not loaded). Runs the same pre-3.5 subset as the release/weekly legs.
  #
  # WEEKLY ONLY (schedule / manual): a regression against a frozen pre-3.5 release
  # is far less likely than one against the moving latest/master the post-merge
  # sanitizer legs cover, so this rides the weekly cadence rather than every merge.
  sanitize-pre35:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: ASan/UBSan/LSan (OpenSSL 3.4, oqsprovider)
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.workspace }}/.local
      LIBOQS_REF: "0.16.0"
      OQSPROV_REF: "00fde3373e466043ee30ed31e32c56f6964ee5f4"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL 3.4 release ref
        id: ossl
        run: |
          set -euo pipefail
          REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "openssl-3.4.*" \
                | awk -F/ '{print $NF}' | grep -E "^openssl-3\\.4\\.[0-9]+$" \
                | sort -V | tail -1)
          SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/.interop/oqs-provider
          key: san34-${{ runner.os }}-ossl-${{ steps.ossl.outputs.sha }}-liboqs-${{ env.LIBOQS_REF }}-oqsp-${{ env.OQSPROV_REF }}

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$PREFIX" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Configure hybrid provider (sanitizers)
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON -DHYBRID_SANITIZE=ON

      - name: Build liboqs + oqs-provider (pinned)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — pre-3.5 subset under ASan/UBSan/LSan
        working-directory: build
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PREFIX/lib64"
          export ASAN_OPTIONS="abort_on_error=1:detect_leaks=1:strict_string_checks=1"
          export LSAN_OPTIONS="suppressions=${GITHUB_WORKSPACE}/test/lsan.supp"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          ctest --output-on-failure \
            -R 'hybrid_replace_test|hybrid_oqs_test|hybrid_compctx_test|hybrid_capability_test|hybrid_bench|hybrid_sizes_test|hybrid_threads_test|composite_sig_test|composite_test|composite_sig_bench|composite_kem_bench|composite_kem_prov_test'

  # ----------------------------------------------------------------- weekly ---
  # Exhaustive per-OpenSSL-version floor matrix against bleeding-edge liboqs +
  # oqs-provider main. Re-validates the drop-in replacement contract as upstream
  # moves and surfaces OQS_CEDE_HYBRIDS patch drift early. Never gates a PR.
  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: weekly · OpenSSL ${{ matrix.openssl.name }} (main deps)
    runs-on: ubuntu-latest
    # issues: write lets a failing leg open/refresh a tracking issue (see the
    # last two steps) — same convention as oqs-hybrid-drift.yml /
    # deprecation-tripwire.yml. Without it a weekly failure is only a red run in
    # the Actions history: nobody watches this tier like a PR, so drift (e.g. an
    # unguarded 3.2+ API on the 3.0 floor, or a compat shim that has fallen behind
    # master) can sit unnoticed. Neither dedicated workflow covers these: the
    # tripwire is a master BUILD only (a runtime undefined-symbol at load stays
    # green there), and the drift check is a buildless algorithm-set diff.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # One tier per behaviour regime, no more: 3.0 = KEM-only (TLS-SIGALG
        # advertising is guarded to 3.2+ in hybrid_caps.c, so the provider builds
        # KEM-only below that); 3.2 = sigs advertised but no native PQ (PQ still
        # entirely from the PQ-only oqsprovider); latest = newest stable release
        # (native ML-KEM/ML-DSA + composite); master = bleeding edge. 3.3/3.4 are
        # the same regime as 3.2, so they add nothing here. pre35 tiers get their
        # PQ from oqsprovider.
        openssl:
          - { name: "3.0",    series: "3.0",    pre35: "true"  }
          - { name: "3.2",    series: "3.2",    pre35: "true"  }
          - { name: "latest", series: "",       pre35: "false" }
          - { name: "master", series: "master", pre35: "false" }
    env:
      PREFIX: ${{ github.workspace }}/.local
      OSSL_INSTALL: ${{ github.workspace }}/ossl-install
      LIBOQS_REF: "main"
      OQSPROV_REF: "main"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL ref
        id: ossl
        run: |
          set -euo pipefail
          S='${{ matrix.openssl.series }}'
          if [ "$S" = "master" ]; then
            REF=master
            SHA=$(git ls-remote https://github.com/openssl/openssl refs/heads/master | cut -f1)
          else
            # empty series => newest stable release; otherwise newest of that series
            if [ -n "$S" ]; then GLOB="openssl-$S.*"; RE="^openssl-${S//./\\.}\\.[0-9]+$"
            else GLOB="openssl-*"; RE="^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$"; fi
            REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "$GLOB" \
                  | awk -F/ '{print $NF}' | grep -E "$RE" | sort -V | tail -1)
            SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      # Cache OpenSSL only (keyed on the resolved commit): released tags stay warm,
      # master rotates. liboqs + oqs-provider main are always rebuilt fresh by
      # setup_oqs_interop.sh — the whole point of this tier — so PREFIX is not cached.
      - name: Cache OpenSSL
        id: cache-ossl
        uses: actions/cache@v4
        with:
          path: ${{ env.OSSL_INSTALL }}
          key: weekly-ossl-${{ runner.os }}-${{ steps.ossl.outputs.sha }}

      - name: Build OpenSSL
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$OSSL_INSTALL" --libdir=lib64
          make -j"$(nproc)" build_sw
          make install_sw

      - name: Stage OpenSSL into .local
        run: cp -a "$OSSL_INSTALL" "$PREFIX"

      - name: Configure hybrid provider
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON

      - name: Build liboqs + oqs-provider (main, fresh)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — full suite (OpenSSL >= 3.5)
        if: matrix.openssl.pre35 != 'true'
        working-directory: build
        run: LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure

      - name: Test — pre-3.5 subset (drop-in over PQ-only oqsprovider)
        if: matrix.openssl.pre35 == 'true'
        working-directory: build
        run: |
          LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure \
            -R 'hybrid_replace_test|hybrid_oqs_test|hybrid_compctx_test|hybrid_capability_test|hybrid_bench|hybrid_sizes_test|hybrid_threads_test|composite_sig_test|composite_test|composite_sig_bench|composite_kem_bench|composite_kem_prov_test'

      # One tracking issue PER OpenSSL leg (the legs fail for different reasons — a
      # build break on the 3.0 floor is not the master test failure), deduped by
      # title so a persistently-red leg bumps its issue rather than filing a new one
      # each week. Runs on any prior-step failure in this leg (build or test). The
      # run still goes red; the issue just makes the failure actionable.
      - name: Open/refresh a tracking issue on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="weekly CI: OpenSSL ${{ matrix.openssl.name }} leg failing (main deps)"
          cat > /tmp/weekly-body.md <<EOF
          The weekly exhaustive leg for OpenSSL \`${{ matrix.openssl.name }}\`
          (resolved \`${{ steps.ossl.outputs.ref }}\`), built against liboqs and
          oqs-provider \`main\`, failed. This tier tracks bleeding-edge upstream, so
          triage whether it is our drift to fix or transient upstream breakage.

          - Run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - OpenSSL: ${{ steps.ossl.outputs.ref }} (${{ steps.ossl.outputs.sha }})
          - liboqs / oqs-provider: main (rebuilt fresh this run)

          _Filed by the weekly matrix (.github/workflows/ci.yml). Dedupes by title,
          so it bumps this issue while the leg stays red; it auto-closes once this
          leg is green again._
          EOF
          gh label create weekly-ci --color fbca04 \
            --description "Weekly exhaustive CI matrix failure" 2>/dev/null || true
          NUM=$(gh issue list --state open --search "in:title $TITLE" \
                  --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Still failing — ${RUN_URL} (commit ${GITHUB_SHA})."
          else
            gh issue create --title "$TITLE" --label weekly-ci --body-file /tmp/weekly-body.md
          fi

      - name: Close the tracking issue when this leg is green again
        if: success()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="weekly CI: OpenSSL ${{ matrix.openssl.name }} leg failing (main deps)"
          NUM=$(gh issue list --state open --search "in:title $TITLE" \
                  --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Green again as of ${RUN_URL} — closing."
            gh issue close "$NUM"
          fi

  # -------------------------------------------------------------------- fuzz ---
  # Coverage-guided decoder fuzzing (issue #41): a bounded libFuzzer session over
  # the untrusted-key-material decode surface — hybrid_decode() (SPKI) /
  # hybrid_decode_p8() (PKCS#8) plus the component sub-key loading they drive
  # (test/hybrid_decode_fuzz.c, -DHYBRID_FUZZ=ON). PR #40 added the harness and
  # wired its STANDALONE seed-replay into ctest for the fast tier; this leg runs
  # the coverage-GUIDED clang/libFuzzer shape, which needs a real fuzzing session
  # and so does not belong on the fast push/PR path.
  #
  # Built with CC=clang against the latest (>=3.5) OpenSSL so the PQ components
  # come from the default provider — no liboqs/oqsprovider needed. The corpus is
  # persisted across runs via actions/cache (restore-keys prefix) so coverage
  # accumulates week over week rather than restarting cold. A crash aborts the
  # session (non-zero exit fails the job) and the crashing input is uploaded as an
  # artifact for reproduction.
  #
  # Session length defaults to 30 min (1800s): the per-run fixed cost (checkout +
  # apt + a possibly-cold OpenSSL build + the clang provider build) is minutes, so
  # a short fuzz would spend most of the job on setup. A manual run can override it
  # via the fuzz_seconds workflow_dispatch input for a deeper session.
  #
  # WEEKLY ONLY (schedule / manual): a real fuzzing session is expensive and its
  # signal is never a PR gate. OSS-Fuzz is the longer-term durable option (see
  # docs/FUZZING.md); this leg gives regular coverage in the meantime.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: libFuzzer decode (latest OpenSSL, clang)
    runs-on: ubuntu-latest
    # issues: write lets a crash open/refresh a tracking issue (see the final
    # step) — the same convention as oqs-hybrid-drift.yml / deprecation-tripwire.yml,
    # so a weekly failure produces an actionable issue rather than a red run that
    # sits unseen in the Actions history.
    permissions:
      contents: read
      issues: write
    env:
      PREFIX: ${{ github.workspace }}/.local
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Resolve OpenSSL release ref
        id: ossl
        run: |
          set -euo pipefail
          REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "openssl-*" \
                | awk -F/ '{print $NF}' | grep -E "^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$" \
                | sort -V | tail -1)
          SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      # Reuse the regular/sanitize/tsan toolchain cache (same key): only the
      # OpenSSL install under $PREFIX is needed here — this >=3.5 leg sources its
      # PQ from the default provider, so no liboqs/oqsprovider is built.
      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/.interop/oqs-provider
          key: reg-${{ runner.os }}-ossl-${{ steps.ossl.outputs.sha }}-liboqs-0.16.0-oqsp-00fde3373e466043ee30ed31e32c56f6964ee5f4

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$PREFIX" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Configure hybrid provider (clang, libFuzzer)
        run: CC=clang cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_FUZZ=ON

      - name: Build provider + fuzz harness
        run: cmake --build build --target hybrid-provider hybrid_decode_fuzz -j"$(nproc)"

      # Persist the corpus across weekly runs so coverage accumulates. The unique
      # run-id key never restore-hits; the restore-keys prefix pulls the most
      # recent prior corpus, and the fresh key saves the grown corpus in the
      # cache post-step (which runs even if the fuzz step fails).
      - name: Restore/seed fuzz corpus
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fuzz-corpus/decode
          key: fuzz-corpus-decode-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-decode-

      - name: Fuzz — bounded libFuzzer decode session
        id: fuzz
        working-directory: build
        env:
          # Manual override via workflow_dispatch input; 1800s (30 min) otherwise
          # (schedule runs carry no inputs, so the fallback applies there).
          FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '1800' }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PREFIX/lib64"
          export OPENSSL_MODULES="$PWD"          # directory holding hybrid.so
          export HYBRID_CEDE_TO_DEFAULT=0        # keep the hybrid decoders offered
          mkdir -p "$GITHUB_WORKSPACE/.fuzz-corpus/decode" \
                   "$GITHUB_WORKSPACE/fuzz-artifacts"
          # Seed the persisted corpus with the committed seeds (first run / new
          # seeds); -n keeps any coverage-increasing inputs added by prior runs.
          cp -n "$GITHUB_WORKSPACE"/test/corpus/decode/* \
                "$GITHUB_WORKSPACE/.fuzz-corpus/decode/" 2>/dev/null || true
          echo "fuzzing for ${FUZZ_SECONDS}s"
          # libFuzzer writes crash-*/leak-*/oom-* to -artifact_prefix and exits
          # non-zero on the first finding, which fails the step.
          ./hybrid_decode_fuzz \
            -max_total_time="$FUZZ_SECONDS" -max_len=65536 -print_final_stats=1 \
            -artifact_prefix="$GITHUB_WORKSPACE/fuzz-artifacts/" \
            "$GITHUB_WORKSPACE/.fuzz-corpus/decode"

      - name: Upload crash artifacts
        if: always() && steps.fuzz.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: ${{ github.workspace }}/fuzz-artifacts
          if-no-files-found: ignore

      # A weekly leg is not watched like a PR, so a crash must produce an
      # actionable artifact AND a tracking issue (same pattern as
      # deprecation-tripwire.yml / oqs-hybrid-drift.yml): dedupe by title so a
      # standing crash bumps the open issue rather than filing a new one each week.
      # The run stays red regardless (the fuzz step already failed the job).
      - name: Open/refresh a tracking issue on crash
        if: always() && steps.fuzz.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Fuzzer: decoder crash in hybrid_decode_fuzz"
          cat > /tmp/fuzz-body.md <<EOF
          The weekly libFuzzer decode leg crashed: a mutated input drove
          hybrid_decode()/hybrid_decode_p8() (or the component sub-key loading they
          drive) into an ASan-detected fault. This is the untrusted-key-material
          decode surface, so treat it as a memory-safety bug until triaged.

          - Run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Crashing input: the \`fuzz-crashes\` artifact on the run above
            (crash-*/leak-*/oom-*).

          **Reproduce** (from a \`-DHYBRID_FUZZ=ON\` build, standalone shape is
          enough — it replays a single file under ASan):

          \`\`\`sh
          OPENSSL_MODULES=\$PWD HYBRID_CEDE_TO_DEFAULT=0 \\
            ./hybrid_decode_fuzz path/to/crash-XXXX
          \`\`\`

          _Filed by the weekly fuzz leg (.github/workflows/ci.yml). It dedupes by
          title, so it bumps this issue rather than filing a new one while it stays
          open; close it once the crash is fixed._
          EOF
          gh label create fuzz --color d93f0b \
            --description "Fuzzer-found defect" 2>/dev/null || true
          NUM=$(gh issue list --state open --label fuzz --search "in:title $TITLE" \
                  --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Still crashing — ${RUN_URL} (commit ${GITHUB_SHA})."
          else
            gh issue create --title "$TITLE" --label fuzz --body-file /tmp/fuzz-body.md
          fi
