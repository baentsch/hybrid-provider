name: CI

# Two tiers:
#   regular (push / PR / manual) — released, PINNED, cached dependencies, so runs
#     are fast and deterministic:
#       OpenSSL 3.4 + latest release, liboqs 0.16.0, oqs-provider @ known-good
#       commit (oqs-provider releases don't pin a liboqs release — it tracks
#       liboqs main — so we pin a validated commit that builds against liboqs
#       0.16.0). Covers both behaviour regimes (pre/post OpenSSL 3.5.0).
#   weekly (schedule / manual) — bleeding edge, rebuilt fresh, to catch upstream
#     breakage early: OpenSSL master + liboqs main + oqs-provider main.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- regular ---
  regular:
    if: github.event_name != 'schedule'
    name: OpenSSL ${{ matrix.openssl.name }} (release)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openssl:
          - { name: "3.4",    series: "3.4" }
          - { name: "latest", series: ""    }   # highest stable openssl-X.Y.Z tag
    env:
      PREFIX: ${{ github.workspace }}/.local
      LIBOQS_REF: "0.16.0"
      OQSPROV_REF: "00fde3373e466043ee30ed31e32c56f6964ee5f4"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL release ref
        id: ossl
        run: |
          set -euo pipefail
          S='${{ matrix.openssl.series }}'
          if [ -n "$S" ]; then GLOB="openssl-$S.*"; RE="^openssl-${S//./\\.}\\.[0-9]+$"
          else GLOB="openssl-*"; RE="^openssl-[0-9]+\\.[0-9]+\\.[0-9]+$"; fi
          REF=$(git ls-remote --tags --refs https://github.com/openssl/openssl "$GLOB" \
                | awk -F/ '{print $NF}' | grep -E "$RE" | sort -V | tail -1)
          SHA=$(git ls-remote https://github.com/openssl/openssl "refs/tags/$REF" | cut -f1)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OpenSSL: $REF ($SHA)"

      # One cache holds the pinned toolchain: OpenSSL + liboqs install (.local)
      # and the oqs-provider build. Everything is a fixed ref, so it reuses across
      # runs until a pin changes.
      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/.interop/oqs-provider
          key: reg-${{ runner.os }}-ossl-${{ steps.ossl.outputs.sha }}-liboqs-${{ env.LIBOQS_REF }}-oqsp-${{ env.OQSPROV_REF }}

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ossl.outputs.ref }}" \
            https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$PREFIX" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Configure hybrid provider
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON

      # Builds/installs pinned liboqs + oqs-provider (skips liboqs if already in
      # $PREFIX from cache; ninja no-ops the cached oqs-provider build) and
      # symlinks oqsprovider.so into build/.
      - name: Build liboqs + oqs-provider (pinned)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — full suite (OpenSSL >= 3.5)
        if: matrix.openssl.name != '3.4'
        working-directory: build
        run: LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure

      # On 3.4 the default provider has no ML-KEM/ML-DSA, so the hybrid provider's
      # MLX algorithms can't be exercised against it; only oqs-interop and
      # version-agnostic tests apply.
      - name: Test — oqs-interop subset (OpenSSL 3.4)
        if: matrix.openssl.name == '3.4'
        working-directory: build
        run: |
          LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure \
            -R 'hybrid_oqs_test|hybrid_compctx_test|hybrid_capability_test|hybrid_bench'

  # ----------------------------------------------------------------- weekly ---
  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: OpenSSL main + liboqs/oqs-provider main
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.workspace }}/.local
      OSSL_INSTALL: ${{ github.workspace }}/ossl-install
      LIBOQS_REF: "main"
      OQSPROV_REF: "main"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Resolve OpenSSL master
        id: ossl
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://github.com/openssl/openssl refs/heads/master | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "OpenSSL master: $SHA"

      # Only OpenSSL is cached (pure, keyed on the master commit); liboqs and
      # oqs-provider main are always rebuilt fresh — the whole point of this tier.
      - name: Cache OpenSSL (master)
        id: cache-ossl
        uses: actions/cache@v4
        with:
          path: ${{ env.OSSL_INSTALL }}
          key: weekly-ossl-${{ runner.os }}-${{ steps.ossl.outputs.sha }}

      - name: Build OpenSSL (master)
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/openssl/openssl ossl-src
          cd ossl-src
          ./Configure --prefix="$OSSL_INSTALL" --libdir=lib64 no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Stage OpenSSL into .local
        run: cp -a "$OSSL_INSTALL" "$PREFIX"

      - name: Configure hybrid provider
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$PREFIX" -DHYBRID_KEM_ENCODERS=ON

      - name: Build liboqs + oqs-provider (main, fresh)
        run: OPENSSL_PREFIX="$PREFIX" BUILD_DIR="$PWD/build" ./test/setup_oqs_interop.sh

      - name: Build hybrid provider
        run: cmake --build build -j"$(nproc)"

      - name: Test — full suite
        working-directory: build
        run: LD_LIBRARY_PATH="$PREFIX/lib64" ctest --output-on-failure
