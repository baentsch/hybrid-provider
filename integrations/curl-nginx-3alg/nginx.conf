# Minimal TLS 1.3 server for the hybrid-provider 3-alg demo.
# Restricted to the single group HQCKEM192MLKEM768X25519 so that any successful
# handshake necessarily exercised all three components (X25519 + ML-KEM-768 +
# HQC-192) across the three providers. Debug error_log (needs --with-debug)
# surfaces the negotiated group server-side.

daemon              off;
worker_processes    1;
pid                 /opt/nginx/logs/nginx.pid;
error_log           /dev/stderr debug;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;

    server {
        listen              4433 ssl;
        server_name         localhost;

        ssl_certificate     /opt/pq/demo/server.crt;
        ssl_certificate_key /opt/pq/demo/server.key;

        ssl_protocols       TLSv1.3;
        # The whole point: offer ONLY the 3-alg hybrid group.
        ssl_ecdh_curve      HQCKEM192MLKEM768X25519;

        location / {
            default_type text/plain;
            return 200 "hybrid-provider 3-alg demo: HQCKEM192MLKEM768X25519 OK\n";
        }
    }
}
