# TLS 1.3 server for the hybrid-provider demo.
#
# As shipped this is a valid single-group config (HQCKEM192MLKEM768X25519, used
# as-is by noconf.sh). entrypoint.sh generates the running config from it,
# replacing ssl_ecdh_curve with EVERY hybrid group the hybrid provider serves
# and the listen port with HYP_PORT.
#
# Evidence of the negotiated KEM group, per handshake: $ssl_curve is echoed in
# the response body and written to the "kem" access log (stdout + file), where
# connect.sh correlates it with its own request id.

daemon              off;
worker_processes    1;
pid                 /opt/nginx/logs/nginx.pid;
error_log           /dev/stderr info;

events {
    worker_connections 64;
}

http {
    log_format kem 'uri=$request_uri curve=$ssl_curve protocol=$ssl_protocol '
                   'cipher=$ssl_cipher client=$remote_addr time=$time_iso8601';
    access_log /dev/stdout kem;
    access_log /opt/nginx/logs/kem-access.log kem;

    server {
        listen              4433 ssl;
        server_name         localhost;

        ssl_certificate     /opt/pq/demo/server.crt;
        ssl_certificate_key /opt/pq/demo/server.key;

        ssl_protocols       TLSv1.3;
        ssl_ecdh_curve      HQCKEM192MLKEM768X25519;

        location / {
            default_type text/plain;
            return 200 "negotiated=$ssl_curve protocol=$ssl_protocol cipher=$ssl_cipher\n";
        }
    }
}
